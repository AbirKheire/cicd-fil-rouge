on: 
  pull_request: 
    branches: [main] 
permissions: 
  contents: read 
jobs: on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install -r requirements-dev.txt
      - run: pytest
  